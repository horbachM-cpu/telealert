[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telealert"
version = "0.1.0"
description = "Windows-first CLI that sends Telegram alerts from any shell using credentials stored in the OS credential store."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "telealert contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "keyring>=25,<26",
]

[project.scripts]
telealert = "telealert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
